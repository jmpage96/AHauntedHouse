  if(moving) {
    if(dx) player.direction=dx>0?'east':'west'; else player.direction=dy>0?'south':'north';
    const length=Math.hypot(dx,dy), distance=64*dt;
    const oldX=player.x,oldY=player.y;
    if(!blocked(player.x+dx/length*distance,player.y)) player.x+=dx/length*distance;
    if(!blocked(player.x,player.y+dy/length*distance)) player.y+=dy/length*distance;
    player.walking=player.x!==oldX||player.y!==oldY;
  } else player.walking=false;
  player.elapsed=player.walking?player.elapsed+dt:0;
}
function draw() {
  ctx.clearRect(0,0,384,288); ctx.drawImage(background,0,0);
  // Hard pixel contact shadow, separate from the transparent production sprite.
  ctx.fillStyle='#30202b'; ctx.fillRect(Math.round(player.x)-6,Math.round(player.y)-1,12,3);
  const col=player.walking?1+Math.floor(player.elapsed/.12)%4:0;
  ctx.drawImage(atlas,col*32,rows[player.direction]*48,32,48,
    Math.round(player.x)-16,Math.round(player.y)-44,32,48);
  // The bookcases occlude the investigator when their feet are farther back.
  for(const o of obstacles) if(player.y<o.y+o.h) {
    const x=o.x-6;
    ctx.drawImage(background,x,50,64,98,x,50,64,98);
  }
  status.textContent=`${player.direction} · ${player.walking?'walking':'idle'} · arrows / WASD`;
}
const movement=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'];
game.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(movement.includes(k)){e.preventDefault();keys.add(k);}});
game.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(movement.includes(k)){e.preventDefault();keys.delete(k);}});
function release(){keys.clear();player.walking=false;player.elapsed=0;}
game.addEventListener('blur',release); window.addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
document.getElementById('reset').onclick=()=>{Object.assign(player,{x:192,y:192,direction:'south',elapsed:0});release();game.focus();};
document.getElementById('scale').onclick=e=>{const native=game.style.width!=='384px';game.style.width=native?'384px':'768px';e.target.textContent=native?'Double size':'Native size';game.focus();};
let previous;
function loop(now){const dt=previous===undefined?0:Math.min((now-previous)/1000,.05);previous=now;update(dt);draw();requestAnimationFrame(loop);}
Promise.all([background.decode(),atlas.decode()]).then(()=>{game.focus();requestAnimationFrame(loop);})
 .catch(()=>{status.textContent='The room could not load. Regenerate with python character.py.';});
</script>
</html>
